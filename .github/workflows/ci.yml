name: MIAYAAR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: miayaar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application and governance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch formatting comparison base
        run: git fetch origin "+refs/heads/${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }}"

      - name: Type check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build production artefacts
        run: pnpm build

      - name: Check formatting of changed files
        env:
          FORMAT_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: pnpm format:check

      - name: Validate whitespace changes
        run: git diff --check
